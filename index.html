<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summerwave</title>
<link rel="canonical" href="https://summerwave.org/">
<meta http-equiv="refresh" content="0; url=https://summerwave.org/">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a1b3f; color: #fff;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    text-align: center; padding: 24px;
  }
  a { color: #7fd4ff; }
  code { background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <p><strong>MacWave 已并入 <a href="https://summerwave.org/">Summerwave</a>，正在跳转…</strong></p>
  <p lang="en"><strong>MacWave is now <a href="https://summerwave.org/">Summerwave</a>. Redirecting…</strong></p>
  <p><small>没有自动跳转？点上面的链接。 / Not redirected? Follow the link above.</small></p>
</main>
<script>
  // 保留路径与查询串：macwave.org/agreement → summerwave.org/agreement
  (function () {
    var target = "https://summerwave.org" + location.pathname + location.search + location.hash;
    if (!/^\/(index\.html)?$/.test(location.pathname)) {
      location.replace(target);
    }
  })();
</script>
</body>
</html>
